<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fifteen Puzzle</title>
  <meta name="description" content="The classic 15 puzzle — slide the tiles until the numbers run in order.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%23f0a93c'/%3E%3Ctext%20x='32'%20y='43'%20font-family='Arial,sans-serif'%20font-size='28'%20font-weight='bold'%20text-anchor='middle'%20fill='%232f1c05'%3E15%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="masthead">
      <h1>Fifteen</h1>
      <p class="tagline">Slide the tiles until the numbers run in order</p>
    </header>

    <section class="hud" aria-label="Game statistics">
      <div class="chip">
        <span class="chip-label">Moves</span>
        <span class="chip-value" id="moves">0</span>
      </div>
      <div class="chip">
        <span class="chip-label">Time</span>
        <span class="chip-value" id="time">0:00</span>
      </div>
      <div class="chip">
        <span class="chip-label">Best</span>
        <span class="chip-value" id="best">—</span>
      </div>
    </section>

    <div class="board-wrap">
      <div class="board" id="board" role="application"
           aria-label="Fifteen puzzle board. Use arrow keys, or tap a tile in the empty row or column."></div>
      <canvas id="fx" aria-hidden="true"></canvas>

      <div class="win" id="win" role="dialog" aria-labelledby="winTitle">
        <div class="win-card">
          <h2 id="winTitle">Solved!</h2>
          <p class="win-stats" id="winStats"></p>
          <p class="badge" id="winBest">★ New best time</p>
          <button class="btn primary" id="again" type="button">Play again</button>
        </div>
      </div>
    </div>

    <section class="controls" aria-label="Controls">
      <div class="seg" role="group" aria-label="Board size">
        <button type="button" data-n="3">3×3</button>
        <button type="button" data-n="4">4×4</button>
        <button type="button" data-n="5">5×5</button>
      </div>
      <button class="btn primary" id="shuffle" type="button">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2 18h3.5c4 0 6-9 10-9H19"/>
          <path d="M2 6h3.5c1.6 0 2.9 1.3 3.9 2.9"/>
          <path d="M19 6l3 3-3 3"/>
          <path d="M19 15l3 3-3 3"/>
        </svg>
        Shuffle
      </button>
      <button class="btn icon" id="sound" type="button" aria-label="Toggle sound">
        <svg id="soundOn" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M11 5 6 9H2v6h4l5 4V5z"/>
          <path d="M15.5 8.5a5 5 0 0 1 0 7"/>
          <path d="M18.5 5.5a9.4 9.4 0 0 1 0 13"/>
        </svg>
        <svg id="soundOff" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="hidden">
          <path d="M11 5 6 9H2v6h4l5 4V5z"/>
          <path d="m16 9 6 6"/>
          <path d="m22 9-6 6"/>
        </svg>
      </button>
    </section>

    <footer class="hint">Tap any tile in the empty row or column — arrow keys work too.</footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
